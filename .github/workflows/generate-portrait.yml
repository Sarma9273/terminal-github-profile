name: Generate profile portrait

on:
  push:
    branches: [main]
    paths:
      - "generate.py"
      - "requirements.txt"
      - "1785407430921.png"
      - ".github/workflows/generate-portrait.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portrait-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate animated SVG portrait
        run: python generate.py 1785407430921.png --output portrait.svg

      - name: Commit generated portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portrait.svg
          git diff --cached --quiet && exit 0
          git commit -m "Generate animated profile portrait"
          git pull --rebase origin main
          git push origin HEAD:main
